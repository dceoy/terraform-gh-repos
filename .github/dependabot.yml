---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      github-actions-dependencies:
        patterns:
          - '*'
  - package-ecosystem: terraform
    directories:
      - /modules/repos/
      - /modules/org/
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      terraform-dependencies:
        patterns:
          - '*'
